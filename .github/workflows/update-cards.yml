name: Update Stats Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download fresh cards
        run: |
          mkdir -p cards
          T=$(date +%s)
          curl -fsSL "https://github-readme-stats.vercel.app/api?username=Saumya-Singh7&show_icons=true&theme=tokyonight&hide_border=true&v=$T" -o cards/stats.svg
          curl -fsSL "https://streak-stats.demolab.com/?user=Saumya-Singh7&theme=tokyonight&hide_border=true&v=$T" -o cards/streak.svg
          curl -fsSL "https://github-readme-stats.vercel.app/api/top-langs/?username=Saumya-Singh7&layout=compact&theme=tokyonight&hide_border=true&v=$T" -o cards/langs.svg
          curl -fsSL "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=Saumya-Singh7&theme=tokyonight&v=$T" -o cards/profile.svg
          curl -fsSL "https://github-readme-activity-graph.vercel.app/graph?username=Saumya-Singh7&theme=tokyo-night&hide_border=true&bg_color=1a1b27&v=$T" -o cards/activity.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet || git commit -m "Update stats cards"
          git push
